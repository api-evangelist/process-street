aid: process-street
name: Process Street
description: >-
  Process Street is a no-code workflow and process management platform for
  building, running, and automating recurring team processes as workflows
  (reusable templates) and workflow runs (checklists). Its REST Public API is
  organized around resource-oriented URLs, accepts and returns JSON, and covers
  workflows, workflow runs, tasks, form fields and values, pages, folders, data
  sets, users, one-off tasks, scheduled workflows, comments, attachments,
  outgoing webhooks, and incoming (data set + workflow) webhooks. Authentication
  is via an X-API-KEY header; results paginate through an opaque cursor with
  HATEOAS next links; and a hosted Model Context Protocol (MCP) server exposes
  most endpoints as tools for AI agents.
