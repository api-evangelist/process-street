    ImportDataSetRowsRequest:
      title: ImportDataSetRowsRequest
      type: object
      required:
      - strategy
      - file
      properties:
        strategy:
          description: "How rows in the uploaded CSV are reconciled with the existing data set.\n\n- `Append` — every uploaded row is inserted as a new row (no `key` required;\n  nothing is updated or deleted).\n- `Upsert` — rows whose `key` column matches an existing row are updated in\n  place; new keys are inserted; rows absent from the upload are left untouched.\n- `Sync` — like `Upsert`, but rows in the data set whose key is absent from\n  the upload are deleted, leaving the data set fully in sync with the file.\n"
          type: string
          enum:
          - Append
          - Upsert
          - Sync
        file:
          description: Uploaded file reference. Use the upload endpoint to attach content.
          type: string
          format: binary
        key:
          description: Unique key used to identify this row across imports — matches the data set column referenced by the webhook's `keyColumn`.
          type: string
