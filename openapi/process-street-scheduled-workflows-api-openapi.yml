                      frequency:
                        description: 'How often the workflow runs. The other fields on the rule depend on this value:

                          `Daily` uses only `interval`, `Weekly` adds `weekDay`, `Monthly` adds `by`, `Yearly` uses only `interval`.'
                        type: string
                        enum:
