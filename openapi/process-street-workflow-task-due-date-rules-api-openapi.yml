openapi: 3.2.0
info:
  title: Process Street Public Workflow Task Due Date Rules API
  version: '1.1'
  description: The Process Street API is organized around REST.
servers:
- url: https://public-api.process.st/api/v1.1
tags:
- name: Workflow Task Due Date Rules
  description: 'A task due date rule defines how an individual task''s due date is calculated

    within a workflow run — relative to the run''s start/due date, a form field

    value, or another task. Use these endpoints to set or clear the due date rule

    on a task within a draft workflow revision.'
  externalDocs:
    url: https://www.process.st/help/docs/dynamic-due-dates/
    description: Process Street help article
paths:
  /workflows/{workflowId}/revisions/{revisionId}/tasks/{taskId}/due-date-rule:
    get:
      tags:
      - Workflow Task Due Date Rules
      summary: Get the task due date rule
      description: Returns the due date rule for a task on a workflow revision. The `rule` field is `null` when no rule is set.
      operationId: getTaskDueDateRule
      parameters:
      - name: workflowId
        in: path
        description: The ID of the Workflow
        required: true
        schema:
          type: string
      - name: revisionId
        in: path
        description: The ID of the Revision
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        description: The ID of the Task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskDueDateRuleResponseResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
      - apiKeyAuth: []
      - httpAuth: []
    put:
      tags:
      - Workflow Task Due Date Rules
      summary: Set the task due date rule
      description: 'Sets the single due date rule for a task on a draft workflow revision, replacing any existing rule. Send `rule: null` (or omit the field) to clear the existing rule. Due date rules cannot be **set** on headings, AI tasks, or Code tasks — but clearing is always permitted so stale rules left over from prior task edits can be removed. `sourceWidgetId` is required when `sourceType` is `FormFieldValue` and must reference a Date form field widget in the same revision. `sourceTaskId` is required when `sourceType` is `TaskCompletedDate` or `TaskDueDate`; it must reference a task earlier than the target task in the same revision and cannot be the target task itself. Returns the resulting rule.'
      operationId: setTaskDueDateRule
      parameters:
      - name: workflowId
        in: path
        description: The ID of the Workflow
        required: true
        schema:
          type: string
      - name: revisionId
        in: path
        description: The ID of the Revision
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        description: The ID of the Task
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskDueDateRuleRequest'
            examples:
              Offset from workflow run start:
                summary: Task is due 3 days after the workflow run starts.
                value:
                  rule:
                    sourceType: ChecklistStartDate
                    offsetDirection: After
                    dueOffset: P3D
                    businessDaysHandlingMode: AllDays
              Offset from previous task:
                summary: Task is due 1 day after the previous task is completed.
                value:
                  rule:
                    sourceType: PreviousTaskCompletedDate
                    offsetDirection: After
                    dueOffset: P1D
                    businessDaysHandlingMode: ShiftToNextBusinessDay
              Offset from another task:
                summary: Task is due 2 days after the source task is completed. `sourceTaskId` must reference a task that appears before the target task in the same revision.
                value:
                  rule:
                    sourceType: TaskCompletedDate
                    sourceTaskId: hj7ZYe6lUQ6Yq0N8tFVFEg
                    offsetDirection: After
                    dueOffset: P2D
                    businessDaysHandlingMode: AllDays
              Offset from a date form field value:
                summary: Task is due 1 business day before a Date form field value.
                value:
                  rule:
                    sourceType: FormFieldValue
                    sourceWidgetId: m95jXOJKAQpfno2TnYVFQw
                    offsetDirection: Before
                    dueOffset: P1D
                    businessDaysHandlingMode: BusinessDaysOnly
              Clear the rule:
                summary: Removes the existing task due date rule.
                value: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskDueDateRuleResponseResponse'
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      security:
      - apiKeyAuth: []
      - httpAuth: []
components:
  schemas:
    UpdateTaskDueDateRuleRequest:
      title: UpdateTaskDueDateRuleRequest
      type: object
      properties:
        rule:
          title: TaskDueDateRuleBody
          description: The rule to set; omit or send `null` to clear the existing rule.
          type: object
          required:
          - sourceType
          - offsetDirection
          - dueOffset
          - businessDaysHandlingMode
          properties:
            sourceType:
              description: How the task's due date is derived. `ChecklistStartDate` / `ChecklistDueDate` — relative to the workflow run's start or due date. `TaskCompletedDate` / `TaskDueDate` — relative to a specific source task (requires `sourceTaskId`). `PreviousTaskCompletedDate` — relative to the task immediately before this one. `FormFieldValue` — relative to a Date form field value (requires `sourceWidgetId`).
              type: string
              enum:
              - FormFieldValue
              - TaskCompletedDate
              - PreviousTaskCompletedDate
              - TaskDueDate
              - ChecklistStartDate
              - ChecklistDueDate
            sourceWidgetId:
              title: EntityID
              description: 'For `sourceType=FormField`: the ID of the Members form field whose value drives the rule''s assignees at runtime. Absent for `sourceType=ChecklistInitiator`.'
              type: string
            sourceTaskId:
              title: EntityID
              type: string
            offsetDirection:
              description: Whether the offset applies before or after the source date.
              type: string
              enum:
              - Before
              - After
            dueOffset:
              description: ISO-8601 duration (e.g. `P7D`, `PT4H30M`).
              type: string
            businessDaysHandlingMode:
              title: BusinessDaysHandlingMode
              description: How non-business days are handled when calculating the due date. `AllDays` counts every day. `BusinessDaysOnly` counts only Monday–Friday. `ShiftToNextBusinessDay` calculates using all days then moves a Saturday/Sunday result to the next Monday.
              type: string
              enum:
              - AllDays
              - BusinessDaysOnly
              - ShiftToNextBusinessDay
    ErrorInfo:
      title: ErrorInfo
      type: object
      required:
      - error
      properties:
        error:
          description: 'Human-readable error message. Suitable for logs or for surfacing to end users; do not parse it

            programmatically — use `errorCode` for that.'
          type: string
        details:
          description: 'Optional structured context. Shape depends on the error: for `Validation` errors the keys are field

            paths; for `PaymentRequired` the keys describe the limit that was hit.'
          type: object
          additionalProperties:
            type: string
        errorCode:
          title: ErrorCode
          description: 'Machine-parsable classification of the error. Always set on responses generated by the global

            exception handler. Branch your own error handling on this (not the message text).'
          type: string
          enum:
          - BadRequest
          - Unauthorized
          - PaymentRequired
          - Forbidden
          - NotFound
          - MethodNotAllowed
          - Conflict
          - PayloadTooLarge
          - Validation
          - RateLimited
          - InternalError
        requestId:
          description: Per-request correlation ID. Include this when contacting support so we can find the request in our logs.
          type: string
    GetTaskDueDateRuleResponseResponse:
      title: GetTaskDueDateRuleResponseResponse
      type: object
      required:
      - data
      properties:
        data:
          title: GetTaskDueDateRuleResponse
          description: The resource returned by this request.
          type: object
          properties:
            rule:
              title: PublicApiTaskDueDateRule
              description: The task's due date rule, or `null` if none is set.
              type: object
              required:
              - sourceType
              - offsetDirection
              - dueOffset
              - businessDaysHandlingMode
              properties:
                sourceType:
                  description: How the task's due date is derived. `ChecklistStartDate` / `ChecklistDueDate` — relative to the workflow run's start or due date. `TaskCompletedDate` / `TaskDueDate` — relative to a specific source task (requires `sourceTaskId`). `PreviousTaskCompletedDate` — relative to the task immediately before this one. `FormFieldValue` — relative to a Date form field value (requires `sourceWidgetId`).
                  type: string
                  enum:
                  - FormFieldValue
                  - TaskCompletedDate
                  - PreviousTaskCompletedDate
                  - TaskDueDate
                  - ChecklistStartDate
                  - ChecklistDueDate
                sourceWidgetId:
                  title: EntityID
                  description: 'For `sourceType=FormField`: the ID of the Members form field whose value drives the rule''s assignees at runtime. Absent for `sourceType=ChecklistInitiator`.'
                  type: string
                sourceTaskId:
                  title: EntityID
                  type: string
                offsetDirection:
                  description: Whether the offset applies before or after the source date.
                  type: string
                  enum:
                  - Before
                  - After
                dueOffset:
                  description: ISO-8601 duration (e.g. `P7D`, `PT4H30M`).
                  type: string
                businessDaysHandlingMode:
                  title: BusinessDaysHandlingMode
                  description: How non-business days are handled when calculating the due date. `AllDays` counts every day. `BusinessDaysOnly` counts only Monday–Friday. `ShiftToNextBusinessDay` calculates using all days then moves a Saturday/Sunday result to the next Monday.
                  type: string
                  enum:
                  - AllDays
                  - BusinessDaysOnly
                  - ShiftToNextBusinessDay
        links:
          description: 'Pagination links. When the result has more pages, look for an entry with `name: "next"` — its `href` is the URL to fetch the next page. Absence of `next` means there are no more pages. For single-resource responses this array is typically empty.'
          type: array
          items:
            title: Link
            description: A HATEOAS link to a related resource. Use these to navigate between resources without constructing URLs by hand.
            type: object
            required:
            - name
            - href
            - type
            properties:
              name:
                description: Standard link relation name (RFC 5988) indicating this link's role. Common values include `self`, `edit`, `related`, `previous`, `next`.
                type: string
              href:
                title: Uri
                description: URL of the linked resource.
                examples:
                - https://api.process.st/api/v1.1/resource/XXX
                type: string
              rel:
                description: Optional. The kind of resource this link points to (e.g. `Workflow`, `Task`, `Comment`).
                type: string
                enum:
                - Approval Task
                - Approvals
                - Assignees
                - Comment
                - Data Set Records
                - Data Sets
                - Form Field Values
                - Subject Task
                - Task
                - Tasks
                - Users
                - Webhook
                - Workflow
                - Workflow Run
              type:
                description: Whether this link targets an API endpoint or a Process Street app URL. `Api` — a callable API endpoint you can fetch directly. `App` — a browser-facing URL in the Process Street UI.
                type: string
                enum:
                - Api
                - App
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    httpAuth:
      type: http
      description: Bearer token (beta)
      scheme: bearer
