    UpdatePageWidgetRequest:
      title: UpdatePageWidgetRequest
      description: Update payload for a page widget. The `type` discriminator selects the widget kind — `Text`, `Image`, `File`, `Video`, `Embed`, or `CrossLink`. Pages do not support form-field widgets.
